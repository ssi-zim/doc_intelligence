name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_branch: version-14
            python_version: "3.11"
            node_version: "18"
          - frappe_branch: version-15
            python_version: "3.11"
            node_version: "18"
          - frappe_branch: version-16
            python_version: "3.14"
            node_version: "24"

    name: Frappe ${{ matrix.frappe_branch }}

    services:
      mariadb:
        image: mariadb:10.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout doc_intelligence
        uses: actions/checkout@v4
        with:
          path: doc_intelligence

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf redis-server mariadb-client

      - name: Install bench
        run: pip install frappe-bench

      - name: Configure MariaDB client
        run: |
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench against Frappe ${{ matrix.frappe_branch }}
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --python "$(which python)" \
            --frappe-branch ${{ matrix.frappe_branch }} \
            frappe-bench
          cd frappe-bench
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://127.0.0.1:13000
          bench set-redis-queue-host redis://127.0.0.1:11000
          bench set-redis-socketio-host redis://127.0.0.1:11000
          sed -i "/redis/d" Procfile

      - name: Link doc_intelligence into the bench
        run: |
          ln -s "$GITHUB_WORKSPACE/doc_intelligence" frappe-bench/apps/doc_intelligence
          cd frappe-bench
          pip install --no-cache-dir -q -U -e apps/doc_intelligence

      - name: New site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket

      - name: Install doc_intelligence on test site
        working-directory: frappe-bench
        run: bench --site test_site install-app doc_intelligence

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app doc_intelligence

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout doc_intelligence
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build
